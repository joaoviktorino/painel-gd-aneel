# DIAGNOSTICO TEMPORARIO (branch claude/diagnostico-aneel, nao vai para o main):
# mede, de dentro do GitHub, por que a conexao com a ANEEL esgota o tempo.
name: Atualizar dados da ANEEL

on:
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Endereco publico deste servidor do GitHub
        run: curl -s --max-time 20 https://ipinfo.io/json || echo "falhou"

      - name: DNS do site da ANEEL
        run: |
          getent ahosts dadosabertos.aneel.gov.br || echo "sem resposta de DNS"

      - name: Conexao TCP na porta 443 (IPv4 e IPv6)
        run: |
          for ip in $(getent ahosts dadosabertos.aneel.gov.br | awk '{print $1}' | sort -u); do
            echo "== $ip"
            timeout 20 bash -c "exec 3<>/dev/tcp/$ip/443" && echo "conectou" || echo "NAO conectou (codigo $?)"
          done

      - name: curl detalhado no site (IPv4)
        run: curl -4 -v --connect-timeout 20 --max-time 40 -o /dev/null https://dadosabertos.aneel.gov.br/ 2>&1 | tail -25 || true

      - name: curl detalhado no site (IPv6)
        run: curl -6 -v --connect-timeout 20 --max-time 40 -o /dev/null https://dadosabertos.aneel.gov.br/ 2>&1 | tail -15 || true

      - name: Outros enderecos da ANEEL e de dados do governo
        run: |
          for u in https://www.gov.br/aneel/pt-br https://dados.gov.br https://www2.aneel.gov.br; do
            echo "== $u"
            curl -s -o /dev/null --connect-timeout 15 --max-time 30 -w "http=%{http_code} conexao=%{time_connect}s total=%{time_total}s\n" "$u" || echo "falhou ($?)"
          done

      - name: Caminho de rede ate o site (traceroute)
        run: |
          sudo apt-get install -y -qq traceroute >/dev/null 2>&1 || true
          timeout 90 traceroute -n -w 2 -q 1 -m 20 -T -p 443 dadosabertos.aneel.gov.br 2>&1 | tail -25 || true
